<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img" aria-label="CivicFlow AI architecture: four static files in the browser">
  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <style>
      .frame{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.5}
      .box{fill:#ffffff;stroke:#cbd5e1;stroke-width:1.5}
      .t{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;font-size:15px;font-weight:600;fill:#0f2b46}
      .s{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;font-size:12.5px;fill:#64748b}
      .n{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;font-size:12px;letter-spacing:.08em;fill:#94a3b8}
      .l{stroke:#94a3b8;stroke-width:1.5;fill:none}
      .dash{stroke:#94a3b8;stroke-width:1.5;fill:none;stroke-dasharray:4 4}
    </style>
  </defs>

  <rect x="20" y="20" width="860" height="390" rx="16" class="frame"/>
  <text x="46" y="48" class="n">BROWSER · NO SERVER · NO BUILD STEP</text>

  <rect x="60" y="66" width="780" height="72" rx="10" class="box"/>
  <text x="84" y="95" class="t">index.html + styles.css</text>
  <text x="84" y="117" class="s">UI shell — sidebar, screens container, modal, toast; design tokens and layout</text>

  <line x1="450" y1="138" x2="450" y2="164" class="l" marker-end="url(#b)"/>

  <rect x="60" y="168" width="780" height="86" rx="10" class="box" stroke="#0d9488"/>
  <text x="84" y="198" class="t">app.js</text>
  <text x="84" y="219" class="s">hash router · screens · wizard · check engine · report · assistant · storage</text>
  <text x="84" y="239" class="s">no network calls — everything is computed from the two data files below</text>

  <line x1="240" y1="288" x2="240" y2="258" class="l" marker-end="url(#b)"/>
  <text x="252" y="278" class="s">reads clauses</text>

  <line x1="660" y1="288" x2="660" y2="258" class="dash" marker-end="url(#b)"/>
  <text x="672" y="278" class="s">loads and saves</text>

  <rect x="60" y="290" width="360" height="86" rx="10" class="box"/>
  <text x="84" y="319" class="t">data.js</text>
  <text x="84" y="340" class="s">14 sample clauses · document types</text>
  <text x="84" y="359" class="s">fee schedule · seed applications</text>

  <rect x="480" y="290" width="360" height="86" rx="10" class="box"/>
  <text x="504" y="319" class="t">localStorage</text>
  <text x="504" y="340" class="s">civicflow.apps.v1 — the applications</text>
  <text x="504" y="359" class="s">seeded on first load, cleared on reset</text>
</svg>
